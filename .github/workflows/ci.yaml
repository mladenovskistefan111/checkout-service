name: CI

# Pull-request gate: guards (change detection, secrets, workflows) start at t=0; when code changed, lint, build, tests, SCA, SAST
# and an image build + CVE scan run in parallel with them (the image is pushed as ghcr.io/<repo>:tree-<hash> and reused by Publish
# after the merge). The only required status check is `ci / gate`; `merge` comes after it and is not part of it.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
      packages: write # the image job pushes ghcr.io/<repo>:tree-<hash> (same-repository runs; a fork's token stays read-only)
    uses: platform-boutique/platform-demo-workflows/.github/workflows/service-ci-go.yaml@9e7a60340fa0720de3fdd72147342e9f5abcbbd3 # v3.6.0
    with:
      test-packages: ./internal/...
      e2e-packages: ./tests/e2e/...
      smoke-port: "5050"
      smoke-env: |
        PRODUCT_CATALOG_SERVICE_ADDR=localhost:3550
        CART_SERVICE_ADDR=localhost:7070
        CURRENCY_SERVICE_ADDR=localhost:7000
        SHIPPING_SERVICE_ADDR=localhost:50051
        PAYMENT_SERVICE_ADDR=localhost:50051
        EMAIL_SERVICE_ADDR=localhost:8080

  # The merge button: waits for you to approve the environment `merge` on the run page (Review deployments), then squash-merges the
  # tested pull request and starts Publish. Not for forks or Dependabot (read-only token): use the normal Merge button there.
  merge:
    needs: ci
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    permissions:
      contents: write
      pull-requests: write
      actions: write # starts Publish
    uses: platform-boutique/platform-demo-workflows/.github/workflows/service-merge.yaml@9e7a60340fa0720de3fdd72147342e9f5abcbbd3 # v3.6.0
