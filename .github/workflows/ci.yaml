name: CI

# Pull-request gate: secret scan, workflow lint and (when code changed) tests, SAST, SCA and an image build + CVE scan, all in
# parallel; nothing is pushed. The only required status check is `ci / gate`.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
      packages: read # reads the registry build cache
      checks: write # only the dotnet test reporter uses it; the grant is checked for every job, skipped ones too
    uses: platform-boutique/platform-demo-workflows/.github/workflows/service-ci.yaml@b31c1150b50fd66b4b7d4c07bd654d1c40e2585e # v3.2.1
    with:
      language: go
      test-packages: ./internal/...
      e2e-packages: ./tests/e2e/...
      smoke-port: "5050"
      smoke-env: |
        PRODUCT_CATALOG_SERVICE_ADDR=localhost:3550
        CART_SERVICE_ADDR=localhost:7070
        CURRENCY_SERVICE_ADDR=localhost:7000
        SHIPPING_SERVICE_ADDR=localhost:50051
        PAYMENT_SERVICE_ADDR=localhost:50051
        EMAIL_SERVICE_ADDR=localhost:8080
