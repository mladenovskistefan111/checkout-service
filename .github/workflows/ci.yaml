name: CI

# Pull-request gate. Nothing runs on a plain push; images are published by release.yaml.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits through the API
    uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/go-ci.yaml@87fca0e809f6ba84b782bc2fb2cc1d740b3c877f # v1.1.0
    with:
      test-packages: ./internal/...
      e2e-packages: ./tests/e2e/...
      smoke-port: "5050"
      smoke-env: |
        PRODUCT_CATALOG_SERVICE_ADDR=localhost:3550
        CART_SERVICE_ADDR=localhost:7070
        CURRENCY_SERVICE_ADDR=localhost:7000
        SHIPPING_SERVICE_ADDR=localhost:50051
        PAYMENT_SERVICE_ADDR=localhost:50051
        EMAIL_SERVICE_ADDR=localhost:8080

  image:
    needs: [go]
    permissions:
      contents: read
      packages: write
    uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/docker-build.yaml@87fca0e809f6ba84b782bc2fb2cc1d740b3c877f # v1.1.0

  workflows:
    permissions:
      contents: read
    uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/workflow-lint.yaml@87fca0e809f6ba84b782bc2fb2cc1d740b3c877f # v1.1.0
